<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Wright operator</title><link rel="stylesheet" href="styles.css"></head><body><main><header><p class="eyebrow">Wright Drafts</p><h1>Text approval executor</h1><p class="intro">Internal only. Every field must match the user's exact reviewed post.</p></header><section class="card fields"><h2>Restore durable account</h2><label>Operator key<input id="restoreKey" type="password"></label><label>TikTok refresh token<input id="refreshToken" type="password"></label><button id="restore" class="secondary">Restore and verify</button><pre id="restoreResult"></pre></section><form id="op" class="card fields"><label>Operator key<input id="key" type="password" autocomplete="off" required></label><label>Post ID<input id="post_id" required></label><label>Version<input id="version" required></label><label>Caption SHA-256<input id="caption_sha256" required></label><label>TikTok open ID<input id="account_open_id" required></label><label>Schedule<input id="scheduled_at_local" type="datetime-local" required></label><label>Timezone<input id="timezone" value="America/Los_Angeles" required></label><label>Privacy<input id="privacy_level" required></label><label>Authority message ID<input id="authority_ref" required></label><label class="check"><input id="disable_comment" type="checkbox"> Disable comments</label><label class="check"><input id="auto_add_music" type="checkbox" checked> Auto-add music</label><label class="check"><input id="commercial" type="checkbox"> Commercial content</label><label>Action<select id="action"><option value="approve">Approve only</option><option value="publish">Approve and submit now</option></select></label><button class="primary">Execute exact action</button><pre id="result"></pre></form></main><script>
const byId=x=>document.getElementById(x);
byId('op').addEventListener('submit',async e=>{e.preventDefault();const ids=['post_id','version','caption_sha256','account_open_id','scheduled_at_local','timezone','privacy_level','authority_ref','action'],b=Object.fromEntries(ids.map(x=>[x,byId(x).value]));for(const x of ['disable_comment','auto_add_music','commercial'])b[x]=byId(x).checked;const r=await fetch('/api/operator/execute',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+byId('key').value},body:JSON.stringify(b)});byId('result').textContent=JSON.stringify(await r.json(),null,2)});
byId('restore').addEventListener('click',async e=>{e.preventDefault();byId('restoreResult').textContent='Verifying…';const r=await fetch('/api/operator/restore',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+byId('restoreKey').value},body:JSON.stringify({refresh_token:byId('refreshToken').value})});byId('refreshToken').value='';byId('restoreResult').textContent=JSON.stringify(await r.json(),null,2)});
</script></body></html>
